<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Digimap Staff Portal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #F4EEFF; --card-bg: #FFFFFF; --primary: #8C6DFD; --primary-light: #B49BFF; 
      --text-main: #2D2A4A; --text-muted: #8E8BA7; --shadow-soft: 0 10px 25px rgba(140, 109, 253, 0.08); 
      --radius-large: 24px; --radius-medium: 16px; --accent-green: #4ADE80; --accent-red: #FB7185; --accent-orange: #FBBF24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; overflow-x: hidden; background-color: var(--bg-main); color: var(--text-main); }
    body { display: block; padding: 20px 16px 120px 16px; }
    
    /* Navigasi Bawah 5 Menu Utama */
    .nav { background: var(--card-bg); padding: 10px 12px; border-radius: 40px; display: flex; gap: 4px; box-shadow: 0 15px 35px rgba(140,109,253,0.18); position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 999; flex-wrap: nowrap; justify-content: space-between; width: 92%; max-width: 500px; }
    .nav button { background: transparent; border: none; padding: 10px 6px; flex: 1; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 30px; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav button.active { background: var(--primary); color: white; box-shadow: 0 8px 15px rgba(140,109,253,0.3); }
    .nav-icon { font-size: 18px; }
    .nav-text { font-size: 10px; white-space: nowrap; }
    
    .tab-content { display: none; width: 100%; max-width: 500px; margin: 0 auto; animation: fadeIn 0.4s ease; padding-bottom: 20px; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .card { background: var(--card-bg); padding: 30px; border-radius: var(--radius-large); box-shadow: var(--shadow-soft); margin-bottom: 20px; }
    .card h2 { text-align: center; margin-bottom: 25px; font-weight: 700; font-size: 22px; color: var(--text-main); }
    
    label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; display: block; margin-top: 15px; }
    input[type="file"], input[type="password"] { width: 100%; padding: 16px; border: 2px solid #F0EDFF; border-radius: var(--radius-medium); margin-bottom: 15px; background: #FAFAFF; font-size: 14px; outline: none; transition: 0.3s; color: var(--text-main); }
    input[type="password"]:focus { border-color: var(--primary); background: #FFF; box-shadow: 0 0 0 4px rgba(140,109,253,0.1); }
    
    .btn-primary { width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; padding: 16px; border: none; border-radius: var(--radius-medium); font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; box-shadow: 0 10px 20px rgba(140,109,253,0.25); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(140,109,253,0.35); }
    .btn-primary:disabled { background: #D4C9FF; cursor: not-allowed; box-shadow: none; transform: none; }
    
    .btn-outline { width: 100%; background: transparent; color: var(--primary); padding: 15px; border: 2px solid var(--primary); border-radius: var(--radius-medium); font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 15px; transition: 0.2s; }
    .btn-outline:hover { background: #F4EEFF; }
    #status { margin-top: 20px; text-align: center; font-weight: 600; color: var(--accent-green); font-size: 14px; }
    
    .dropdown-container { text-align: center; margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    select, input[type="text"].search-box { padding: 16px 20px; border-radius: 30px; border: 2px solid #FFF; font-size: 14px; font-weight: 600; color: var(--text-main); background: var(--card-bg); width: 100%; outline: none; box-shadow: var(--shadow-soft); transition: 0.3s; }
    select { cursor: pointer; appearance: none; text-align: center; }
    select:focus, input[type="text"].search-box:focus { border-color: var(--primary); }
    input[type="text"].search-box::placeholder { color: var(--text-muted); font-weight: 500; }
    
    .hero-header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); border-radius: var(--radius-large); padding: 24px 22px; color: white; margin-bottom: 20px; position: relative; overflow: hidden; box-shadow: 0 15px 30px rgba(140,109,253,0.2); }
    .hero-header::after { content: ''; position: absolute; top: -30px; right: -30px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; }
    .hero-header::before { content: ''; position: absolute; bottom: -20px; left: 20px; width: 60px; height: 60px; background: rgba(255,255,255,0.1); border-radius: 50%; }
    .hero-title { font-size: 13px; font-weight: 500; opacity: 0.9; margin-bottom: 4px; z-index: 2; position: relative; }
    .hero-name { font-size: 24px; font-weight: 700; z-index: 2; position: relative; }
    
    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; }
    .kpi-card { background: var(--card-bg); padding: 20px 15px; border-radius: var(--radius-large); box-shadow: var(--shadow-soft); display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
    .kpi-bg-icon { position: absolute; right: -10px; bottom: -10px; font-size: 60px; opacity: 0.03; z-index: 0; }
    .kpi-title { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 8px; z-index: 1; }
    .kpi-value { font-size: 20px; font-weight: 700; color: var(--text-main); z-index: 1; }
    .kpi-rank-badge { position: absolute; top: 15px; right: 15px; background: #FEF3C7; color: #D97706; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }

    .section-title { font-size: 16px; font-weight: 700; color: var(--text-main); margin: 25px 0 15px 5px; }
    #qtyKPI { display: flex; gap: 12px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 10px; -ms-overflow-style: none; scrollbar-width: none; }
    #qtyKPI::-webkit-scrollbar { display: none; }
    .qty-card { background: var(--card-bg); padding: 15px; border-radius: var(--radius-medium); box-shadow: var(--shadow-soft); text-align: center; min-width: 90px; flex-shrink: 0; }
    .qty-emoji { font-size: 24px; margin-bottom: 8px; background: var(--bg-main); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px auto; }
    .qty-label { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
    .qty-val { font-size: 18px; font-weight: 700; color: var(--primary); } 

    .detail-card { background: var(--card-bg); padding: 22px; border-radius: var(--radius-large); box-shadow: var(--shadow-soft); margin-bottom: 15px; }
    .detail-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    .detail-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .detail-title { font-size: 14px; font-weight: 600; color: var(--text-main); }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .stat-label { font-size: 12px; color: var(--text-muted); }
    .stat-val { font-size: 14px; font-weight: 700; color: var(--text-main); }
    .progress-bar-container { width: 100%; background-color: #F0EDFF; border-radius: 10px; height: 8px; margin-top: 10px; overflow: hidden; }
    .progress-bar { height: 100%; border-radius: 10px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }

    .loading-text { text-align: center; font-weight: 500; color: var(--text-muted); display: none; margin: 20px 0; font-size: 14px; }
    
    .table-container { background: var(--card-bg); border-radius: var(--radius-large); box-shadow: var(--shadow-soft); overflow: hidden; margin-bottom: 25px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #FAFAFF; color: var(--text-muted); padding: 16px; font-weight: 600; font-size: 12px; text-transform: uppercase; border-bottom: 1px solid #F0EDFF; }
    td { padding: 16px; border-bottom: 1px solid #F8F7FF; color: var(--text-main); font-size: 13px; font-weight: 500; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background-color: #FCFBFF; }
    .qty-badge { background: #EEF2FF; color: var(--primary); padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 13px; display: inline-block; min-width: 45px; text-align: center; }

    .payslip { background: #FFFFFF; padding: 0; border-radius: var(--radius-large); margin-top: 10px; box-shadow: var(--shadow-soft); overflow: hidden; border: 1px solid #F0EDFF; }
    .payslip-header { background: linear-gradient(135deg, var(--primary), var(--primary-light)); padding: 25px; text-align: center; color: white; }
    .payslip-header h3 { font-size: 18px; font-weight: 700; opacity: 0.9; margin-bottom: 5px; }
    .payslip-header h2 { font-size: 24px; font-weight: 800; }
    .payslip-body { padding: 25px; }
    .payslip-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #E2E8F0; }
    .payslip-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .payslip-label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .payslip-value { font-size: 15px; font-weight: 600; color: var(--text-main); }
    .payslip-total-box { background: #FAFAFF; padding: 20px; border-radius: var(--radius-medium); text-align: center; margin-top: 15px; border: 1px solid #F0EDFF; }
    .payslip-total-label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 5px; text-transform: uppercase; }
    .payslip-total-val { font-size: 26px; color: var(--primary); font-weight: 800; }
    .payslip-note { margin-top: 20px; font-size: 11px; color: #94A3B8; text-align: center; line-height: 1.5; background: #F8FAFC; padding: 15px; border-radius: 12px; }

    .c-blue { color: #3B82F6; } .bg-blue { background: rgba(59, 130, 246, 0.1); } .bar-blue { background-color: #3B82F6; }
    .c-purple { color: #8B5CF6; } .bg-purple { background: rgba(139, 92, 246, 0.1); } .bar-purple { background-color: #8B5CF6; }
    .c-orange { color: #F59E0B; } .bg-orange { background: rgba(245, 158, 11, 0.1); } .bar-orange { background-color: #F59E0B; }
    .c-green { color: #10B981; } .bg-green { background: rgba(16, 185, 129, 0.1); }

    /* Styling Bagian Sales Harian Staff */
    .daily-header-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 28px 0 12px 2px; flex-wrap: wrap; }
    .daily-date-nav { display: flex; align-items: center; gap: 6px; background: var(--card-bg); padding: 5px 8px; border-radius: 20px; box-shadow: var(--shadow-soft); }
    .btn-date-step { background: var(--bg-main); border: none; color: var(--primary); width: 30px; height: 30px; border-radius: 50%; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .daily-date-input { border: none; background: transparent; font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 600; color: var(--text-main); outline: none; cursor: pointer; }
    .daily-meta-info { font-size: 11.5px; color: var(--text-muted); margin: 0 0 14px 5px; }
    .qty-row-scroll { width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 6px; margin-bottom: 15px; }
    .qty-row-scroll .qty-card { min-width: 0; padding: 14px 2px; border-radius: 16px; }
    .qty-row-scroll .qty-emoji { width: 36px; height: 36px; font-size: 18px; margin-bottom: 6px; }
    .qty-row-scroll .qty-val { font-size: 16px; }
    .qty-row-scroll .qty-label { font-size: 9.5px; letter-spacing: -0.2px; }

    /* Styling Menu Pusat Form & Link */
    .link-hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; z-index: 2; position: relative; }
    .btn-add-link { background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.45); color: white; padding: 8px 13px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; backdrop-filter: blur(4px); white-space: nowrap; }
    .chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; scrollbar-width: none; }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip-btn { background: var(--card-bg); border: 1.5px solid #EDE9FE; color: var(--text-muted); padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .chip-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 6px 14px rgba(140,109,253,0.22); }

    .form-card { background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow-soft); border: 1.5px solid transparent; }
    .form-top { display: flex; gap: 13px; align-items: flex-start; }
    .form-icon { width: 44px; height: 44px; border-radius: 14px; background: var(--bg-main); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .form-info { flex: 1; min-width: 0; }
    .form-badge { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; padding: 3px 9px; border-radius: 10px; background: #F4EEFF; color: var(--primary); margin-bottom: 5px; }
    .form-title { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 3px; line-height: 1.3; overflow-wrap: break-word; word-break: break-word; }
    .form-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; overflow-wrap: break-word; word-break: break-word; }
    .form-actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed #F0EDFF; }
    .btn-copy-link { flex: 1; background: #F8F7FF; border: 1.5px solid #E9E4FF; color: var(--primary); padding: 10px 8px; border-radius: 12px; font-size: 11.5px; font-weight: 600; cursor: pointer; text-align: center; white-space: nowrap; }
    .btn-open-link { flex: 1.2; background: linear-gradient(135deg, var(--primary), var(--primary-light)); border: none; color: white; padding: 10px 10px; border-radius: 12px; font-size: 11.5px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 6px 14px rgba(140,109,253,0.22); white-space: nowrap; }
    .btn-edit-custom { background: #EEF2FF; border: none; color: var(--primary); padding: 0 11px; border-radius: 12px; font-size: 13px; cursor: pointer; }
    .btn-del-custom { background: #FFF1F2; border: none; color: #FB7185; padding: 0 11px; border-radius: 12px; font-size: 13px; cursor: pointer; }

    /* Styling Menu Pilihan Staf (Gaji, Biodata, Jadwal Shift) */
    .hub-choice-card { background: var(--card-bg); border-radius: 22px; padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow-soft); display: flex; align-items: center; gap: 15px; cursor: pointer; border: 2px solid transparent; transition: 0.2s ease; }
    .hub-choice-card:active { transform: scale(0.98); border-color: var(--primary-light); }
    .hub-choice-icon { width: 54px; height: 54px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
    .hub-choice-info { flex: 1; min-width: 0; }
    .hub-choice-title { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 3px; }
    .hub-choice-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
    .hub-choice-arrow { font-size: 20px; font-weight: 700; color: var(--primary); }
    .sub-switcher-bar { display: flex; align-items: center; gap: 5px; background: var(--card-bg); padding: 6px; border-radius: 20px; box-shadow: var(--shadow-soft); margin-bottom: 16px; }
    .btn-back-hub { background: #F4EEFF; border: none; color: var(--primary); padding: 9px 10px; border-radius: 14px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .sub-switch-btn { flex: 1; border: none; background: transparent; padding: 9px 4px; border-radius: 14px; font-size: 11.5px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .sub-switch-btn.active { background: var(--primary); color: white; box-shadow: 0 6px 14px rgba(140,109,253,0.22); }

    /* Styling Menu Biodata Tim */
    .bio-card { background: var(--card-bg); border-radius: 22px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-soft); }
    .bio-header { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
    .bio-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 3px solid #F4EEFF; }
    .bio-main-info { flex: 1; min-width: 0; }
    .bio-name { font-size: 16px; font-weight: 700; color: var(--text-main); line-height: 1.3; overflow-wrap: break-word; }
    .bio-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .bio-role-badge { font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 12px; background: #F4EEFF; color: var(--primary); }
    .bio-bday-badge { font-size: 10.5px; font-weight: 700; padding: 3px 10px; border-radius: 12px; background: #FEF3C7; color: #D97706; }
    .bio-details { background: #FAFAFF; border-radius: 16px; padding: 13px 15px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #F0EDFF; }
    .bio-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; font-size: 12px; }
    .bio-lbl { color: var(--text-muted); font-weight: 500; white-space: nowrap; }
    .bio-val { color: var(--text-main); font-weight: 600; text-align: right; overflow-wrap: break-word; word-break: break-word; }
    .btn-wa-link { flex: 1.3; background: linear-gradient(135deg, #22C55E, #16A34A); border: none; color: white; padding: 10px 10px; border-radius: 12px; font-size: 11.5px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 5px; box-shadow: 0 6px 14px rgba(34,197,94,0.22); white-space: nowrap; }

    /* =========================================================
       STYLING MENU JADWAL SHIFT & CATATAN PER STAF
       ========================================================= */
    .week-nav-bar { background: var(--card-bg); border-radius: 18px; padding: 8px 10px; margin-bottom: 13px; box-shadow: var(--shadow-soft); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .btn-week-step { width: 34px; height: 34px; border-radius: 12px; border: none; background: #F4EEFF; color: var(--primary); font-size: 13px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .week-range-label { font-size: 12.5px; font-weight: 700; color: var(--text-main); text-align: center; }

    .subview-tabs { display: flex; background: #E8E0FF; padding: 5px; border-radius: 18px; margin-bottom: 14px; }
    .subview-tab-btn { flex: 1; border: none; background: transparent; padding: 10px 6px; border-radius: 14px; font-size: 12px; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: 0.2s ease; }
    .subview-tab-btn.active { background: var(--card-bg); color: var(--primary); box-shadow: 0 4px 12px rgba(140, 109, 253, 0.15); }

    .day-selector-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 12px; }
    .day-pill { position: relative; background: var(--card-bg); border: 1.5px solid transparent; border-radius: 16px; padding: 9px 2px 8px 2px; text-align: center; cursor: pointer; box-shadow: var(--shadow-soft); transition: 0.16s; }
    .day-pill .dp-name { display: block; font-size: 10px; font-weight: 600; color: var(--text-muted); }
    .day-pill .dp-num { display: block; font-size: 13.5px; font-weight: 800; color: var(--text-main); }
    .day-pill.active { background: var(--primary); box-shadow: 0 8px 16px rgba(140, 109, 253, 0.28); transform: translateY(-2px); }
    .day-pill.active .dp-name, .day-pill.active .dp-num { color: #FFFFFF; }
    .note-dot-indicator { position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: #F59E0B; }
    .day-pill.active .note-dot-indicator { background: #FDE047; }

    .daily-summary-bar { background: var(--card-bg); border-radius: 18px; padding: 11px 13px; margin-bottom: 12px; box-shadow: var(--shadow-soft); }
    .dsb-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
    .dsb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .dsb-chip { padding: 5px 2px; border-radius: 10px; font-size: 10px; font-weight: 700; text-align: center; }

    /* Kartu Per Hari: Nama & Jam Rata Kiri, Catatan Rata Kanan */
    .daily-staff-row { background: var(--card-bg); border-radius: 20px; padding: 13px 14px; margin-bottom: 10px; box-shadow: var(--shadow-soft); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .daily-staff-row.is-off { opacity: 0.78; background: #FCFBFF; }
    .dsr-left { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 0; text-align: left; }
    .sch-avatar { width: 42px; height: 42px; border-radius: 50%; font-size: 13.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .av-P { background: #DBEAFE; color: #1D4ED8; border: 2px solid #BFDBFE; }

        const rightActionHtml = noteText

             </button>`
          : `<button type="button" class="btn-add-note-right" onclick="openStaffNoteModal('${escapeAttr(member.name)}', '${d.key}')">+ Catatan</button>`;

        return `
          <div class="staff-day-row ${isOff ? 'is-off' : ''}">

              <div class="day-badge-box ${sh.avClass}">
